name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - uses: golangci/golangci-lint-action@v9
      - run: test -z "$(gofmt -l cmd internal pkg test)"
